steps:
  # 1) Install deps + run tests (CI)
  - name: "node:20"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        npm ci
        npm test

  # 2) Build Docker image
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/releasepilot-node:$COMMIT_SHA", "."]

  # 3) Push image
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/releasepilot-node:$COMMIT_SHA"]

  # 4) Deploy to Cloud Run (DEV)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "releasepilot-dev"
      - "--image"
      - "gcr.io/$PROJECT_ID/releasepilot-node:$COMMIT_SHA"
      - "--region"
      - "europe-west1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--set-env-vars"
      - "ENV=dev,SERVICE_NAME=releasepilot-node,VERSION=dev,COMMIT_SHA=$COMMIT_SHA"

images:
  - "gcr.io/$PROJECT_ID/releasepilot-node:$COMMIT_SHA"